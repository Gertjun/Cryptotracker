# Draait de automatische tests bij elke upload en bij elk voorstel (pull request)
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    # vast op 24.04: Playwright ondersteunt ubuntu-latest (26.04) nog niet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testrapport
          path: tests/playwright-report
          retention-days: 14
