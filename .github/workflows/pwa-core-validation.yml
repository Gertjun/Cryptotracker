name: PWA-Core validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-core-pin:
    runs-on: ubuntu-24.04
    steps:
      - actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify pinned Core release and file checksums
        run: node tools/pin.mjs verify
      - name: Verify Core files are in the static service-worker precache
        run: node tools/precache.mjs --manifest core-manifest.json --service-worker sw.js
