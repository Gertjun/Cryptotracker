name: PWA-Core validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-core-pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify pinned Core release and file checksums
        run: node tools/pin.mjs verify
      - name: Verify Core files are in the static service-worker precache
        run: node tools/precache.mjs --manifest core-manifest.json --service-worker sw.js
