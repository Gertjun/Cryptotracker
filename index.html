<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://coin-images.coingecko.com https://assets.coingecko.com; connect-src 'self' https://api.coingecko.com https://api.github.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Crypto">
  <title>Crypto Portfolio</title>
  <meta name="description" content="Persoonlijke app om crypto-investeringen, cash en (on)gerealiseerde winst bij te houden.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- Vroeg verbinding maken met de servers die de app meteen nodig heeft -->
  <link rel="preconnect" href="https://api.coingecko.com" crossorigin>
  <link rel="preconnect" href="https://coin-images.coingecko.com">
  <link rel="dns-prefetch" href="https://api.github.com">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <style>
:root{--sheet:#121620;--side:#0f1218;--tab:rgba(11,13,18,.94);--toast:#2a3040;--bg:#0b0d12;--card:#151922;--card2:#1c212c;--line:#262c39;--text:#eef1f6;--muted:#8b93a5;--green:#1fd17a;--red:#ff5a5f;--accent:#4f8cff;--yellow:#f5b942}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;font-variant-numeric:tabular-nums}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* rij-knoppen en -links: zien eruit als tekst, maar zijn met Tab en Enter te bedienen */
.rowlink{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;text-decoration:none;cursor:pointer;line-height:inherit}
button.rowlink.nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
a.nav,a.side-coin{color:inherit;text-decoration:none}a.nav{color:var(--muted)}
button.side-coin,button.sync,button.iss{background:none;border:0;font:inherit;color:inherit;text-align:left;width:100%}
button.sync{width:auto;padding:0;color:var(--muted)}
button.zoom-hint{background:none;border:0;padding:0;font-family:inherit;cursor:pointer}
th>button.rowlink{font-weight:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
#app{max-width:560px;margin:0 auto;padding:0 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.top h1{font-size:17px;margin:0;flex:1;text-align:center;font-weight:650;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.icon-btn{background:var(--card);border:0;color:var(--text);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}
.sync{font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;flex:0 1 auto;line-height:1.25;cursor:pointer;min-width:0}
.sl{display:flex;align-items:center;gap:5px;white-space:nowrap}
.sl b{font-weight:600;color:var(--text)}
.dot.off{background:var(--muted)}
.dot{width:8px;height:8px;min-width:8px;flex:none;display:inline-block;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.busy{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.hero{text-align:center;padding:14px 0 18px}
.label{color:var(--muted);font-size:13px}
.big{font-size:40px;font-weight:700;letter-spacing:-.8px;margin:2px 0 6px}
.pl-toggle{background:var(--card);border:0;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:999px;display:inline-flex;gap:8px;align-items:center}
.pl-toggle small{color:var(--muted);font-weight:500}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}
.pill{display:inline-block;padding:2px 7px;border-radius:7px;font-weight:600;font-size:13px}
.pill.up{background:rgba(31,209,122,.13)}.pill.down{background:rgba(255,90,95,.13)}
.sub{color:var(--muted);font-size:13px;margin-top:10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px}
.alloc-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.list-head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}
.list-head h2{font-size:16px;margin:0}
.list-head select{background:var(--card);border:0;border-radius:10px;padding:6px 8px;font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.coin-img{width:36px;height:36px;border-radius:50%;background:var(--card2);flex:none;object-fit:cover}
.coin-ph{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name.nt{display:flex;align-items:center;gap:6px}.name.nt .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}.name.nt .tx-type{flex:none}
.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.right{text-align:right;flex:none}
.right .v{font-weight:600}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
details.closed{margin-top:14px}
details.closed summary{color:var(--muted);font-size:13px;cursor:pointer;padding:6px 2px}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--green);color:#03150b;font-size:30px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer;display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.fab{transition:transform .22s ease,opacity .22s ease}.fab.away{transform:translateY(150px);opacity:0;pointer-events:none}   /* verdwijnt bij omlaag scrollen */
/* detail */
.price-big{font-size:32px;font-weight:700;letter-spacing:-.5px}
.chart-wrap{position:relative;margin:10px -4px 6px;touch-action:pan-y}
.chart-wrap svg{display:block;width:100%;height:190px}
.chart-msg{height:190px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.ranges{display:flex;justify-content:space-between;gap:6px;margin-bottom:16px}
.ranges button{flex:1;background:none;border:0;color:var(--muted);padding:7px 0;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
.ranges button.on{background:var(--card);color:var(--text)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat .label{font-size:12px}
.stat .val{font-weight:650;font-size:16px;margin-top:2px;word-break:break-word}
.stat.wide{grid-column:1/-1}
.tx-type{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.3px}
.tx-type.buy{background:rgba(31,209,122,.13);color:var(--green)}
.tx-type.sell{background:rgba(255,90,95,.13);color:var(--red)}
.note{color:var(--muted);font-size:12px;margin-top:8px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden,.sheet:not([open]){display:none}
dialog.sheet,dialog.zoom{max-width:none;max-height:none;width:auto;height:auto;margin:0;border:0;color:inherit}
dialog.sheet{padding:0;background:transparent;overflow:visible}
dialog.sheet::backdrop,dialog.zoom::backdrop{background:transparent}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s}
.sheet-card{position:relative;background:var(--sheet);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.h3{margin:0 0 4px;font-size:16px}   /* kaartkoppen zijn <h2>, met het uiterlijk van de oude h3 */
.sheet h3,.sheet .h3{margin:4px 0 16px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--text)}
.field input:focus{border-color:var(--accent)}
/* Zichtbare focus voor toetsenbordgebruikers (alleen bij Tab, niet bij tikken of klikken) */
:where(a,button,select,summary,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
:where(input,select,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.rowlink:focus-visible{outline:none}
.row:has(.rowlink:focus-visible),.goal:has(.rowlink:focus-visible){outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
tr:has(.rowlink:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
tr:has(.rowlink:focus-visible) td{background:var(--card2)}
th .rowlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg button:focus-visible,.ranges button:focus-visible{outline-offset:-2px}
html{scroll-padding-bottom:96px}
/* Beweging verminderen (instelling van iOS/macOS/Windows): geen animaties, overgangen of soepel scrollen */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
  .dot.busy{animation:none!important;opacity:.7}
}   /* gefocust element niet verstopt achter de tabbalk onderaan */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:650;cursor:pointer;color:var(--muted)}
.seg button.on.buy{background:var(--green);color:#03150b}
.seg button.on.sell{background:var(--red);color:#1a0204}.light .seg button.on.sell{color:#fff}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;background:var(--green);color:#03150b;margin-top:6px}
.btn.sec{background:var(--card);color:var(--text)}
.btn.danger{background:transparent;color:var(--red)}
.btn:disabled{opacity:.5}
.results{list-style:none;margin:0 0 12px;padding:0;background:var(--card);border-radius:12px;overflow:hidden}
.results li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.results li:last-child{border-bottom:0}
.results img{width:26px;height:26px;border-radius:50%}
.chosen{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.chosen button{margin-left:auto;background:none;border:0;color:var(--accent);cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin:-4px 2px 12px}
.section-t{font-size:13px;color:var(--muted);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.4px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--toast);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.private .m{filter:blur(7px);user-select:none}
a{color:var(--accent)}
/* lichte weergave */
:root.light{--sheet:#ffffff;--side:#fbfbfc;--tab:rgba(255,255,255,.94);--toast:#1f2430;--bg:#f3f4f7;--card:#ffffff;--card2:#eceef2;--line:#e2e5ea;--text:#151821;--muted:#5b6372;--green:#047857;--red:#c8333a;--accent:#2563eb;--yellow:#8a5a0f}   /* licht thema: alle tekstkleuren ≥ 4,5:1 contrast */
.light .card,.light .stat,.light .list,.light .tbl-wrap,.light .icon-btn,.light .pl-toggle{box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.04)}
.light .tx-type.transfer{color:#4b5563;background:#e5e7eb}
.light .tx-type.buy{color:#065f46}.light .tx-type.receive{color:#6d28d9}.light .tx-type.deposit{color:#1d4ed8}
.light .seg button.on.buy,.light .btn,.light .fab,.light .btn-add{color:#fff}
.light .btn.sec{color:var(--text)}.light .btn.danger{color:var(--red)}
.light .tabbar{border-top-color:var(--line)}
.lock{text-align:center;padding:12vh 8px 0;max-width:360px;margin:0 auto}
.lock-ic{width:76px;height:76px;border-radius:24px;background:var(--card);display:grid;place-items:center;margin:0 auto 18px;color:var(--green)}
.lock-ic svg{width:36px;height:36px}
.lock h2{margin:0 0 4px;font-size:22px}
.lock>.label{margin:0 0 30px}
.lock .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.lock .btn svg{width:20px;height:20px}
.or{color:var(--muted);font-size:13px;margin:16px 0}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:12px}
.locked .fab{display:none}
.period{text-align:center;color:var(--muted);font-size:13px;margin:-8px 0 14px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.period i{display:inline-block;width:14px;border-top:2px dashed var(--muted);vertical-align:middle;margin-right:5px}
#pchart svg{height:170px}#pchart .chart-msg{height:170px}
.tb-group{display:flex;gap:8px;flex:none}
.m-top,.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
#side{display:none}
.side-col .card{margin-bottom:14px}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv>div:last-child{border-bottom:0}
.kv small{font-weight:600;font-size:12px}
.tbl-wrap{background:var(--card);border-radius:16px;overflow:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl td{padding:12px 12px;font-size:14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl .l{text-align:left}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--card2)}
.tbl th[data-sort]{cursor:pointer}
.tbl th[data-sort]:hover,.tbl th.on{color:var(--text)}
.coin-cell{display:flex;align-items:center;gap:12px}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.note-cell{color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:var(--tab);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{text-decoration:none;flex:1;max-width:200px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer}
.tabbar svg{width:23px;height:23px}
.tabbar a.on{color:var(--text)}
.locked .tabbar{display:none}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 14px}
.filters input,.filters select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--text);min-width:0}
.filters input{flex:1 1 100%}
.filters select{flex:1 1 140px}
.filters .seg{margin:0;flex:1 1 100%}
.seg button.on.all{background:var(--card2);color:var(--text)}
.month-h{font-size:13px;color:var(--muted);margin:18px 4px 8px;text-transform:capitalize}
.month-h:first-child{margin-top:4px}
.tx-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tx-sum.odd .stat:first-child{grid-column:1/-1}
.tx-type.deposit{background:rgba(79,140,255,.15);color:#79a6ff}
.tx-type.withdraw{background:rgba(245,185,66,.15);color:var(--yellow)}
.seg4{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg4 button{padding:9px 2px;font-size:14px}
.seg button.on.receive{background:#b56cff;color:#fff}
.seg button.on.transfer,.seg button.on.other{background:#c9ced8;color:#111}
.tx-type.receive{background:rgba(181,108,255,.15);color:#c99bff}
.tx-type.transfer{background:rgba(201,206,216,.12);color:#c9ced8}
.seg button.on.deposit,.seg button.on.cash{background:var(--accent);color:#fff}
.seg button.on.withdraw{background:var(--yellow);color:#1a1300}
.cash-ic{color:var(--accent)!important;font-size:16px!important}
.kv-h{align-items:center!important}
.kv-h b{font-size:15px}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:13px}
.calc input{color:var(--muted);border-style:dashed}
.calc label::after{content:' · berekend';color:var(--accent)}
.warn{color:var(--yellow);font-size:12px;margin:8px 0 2px}
.rep-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}   /* kolom nooit breder dan het scherm */
.rep-grid>*,.rep-grid .card,.cc,.cc-scroll{min-width:0}
.rt td:first-child{white-space:normal}
.rt th{white-space:normal;vertical-align:bottom}
.rep-grid .card,.zoom .card{overflow-x:auto}   /* past een tabel echt niet, dan scrolt alleen het blok opzij */
@media (max-width:420px){.rt td,.rt th{padding:7px 3px;font-size:13px}.rt th{font-size:11px}}
@media (max-width:360px){.filters .seg button{font-size:13px;padding:8px 1px}}
/* Tikvlakken van minstens 44 px op touchscreens: kleine knoppen krijgen een onzichtbaar groter vlak */
@media (pointer:coarse){
  .icon-btn{width:44px;height:44px}
  .link,.ranges button,.sync,.cal-nav button,[data-rp],.zoom-hint,.x{position:relative}
  .link::after,.zoom-hint::after{content:'';position:absolute;inset:-14px -8px}
  .sync::after{content:'';position:absolute;inset:-16px -8px}
  .ranges button::after{content:'';position:absolute;inset:-6px 0}
  .cal-nav button::after,[data-rp]::after,.x::after{content:'';position:absolute;inset:-6px}
  .seg button{min-height:44px}
  select,.filters input,.pl-toggle{min-height:44px}
  summary.yr{min-height:44px}
  .btn.sec{min-height:44px}
}
.rep-grid .card{margin:0}
.rep-col{display:contents}
.zoomable{cursor:pointer}
.zoom-hint{float:right;font-size:12px;color:var(--accent);font-weight:600;margin-top:2px}
.zoom{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
.zoom-in{max-width:1200px;margin:0 auto}
.zoom-top{display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px}
.zoom-top h2{margin:0;font-size:20px}
.zoom-chart{overflow-x:auto;margin:4px -4px 0;padding:0 4px}
.zoom .bars{height:320px}
.zc-wrap{position:relative}
.since{position:relative}
.since .x{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
.since-g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.since-g>div{background:var(--card2);border-radius:12px;padding:10px}
.since-g b{display:block;font-size:16px;margin-top:2px}
@media (min-width:1000px){.since-g{grid-template-columns:repeat(4,1fr)}}

.row:has(>.mkt-chg){flex-wrap:wrap;row-gap:4px}
.mkt-chg{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:0 14px;font-size:12px;font-variant-numeric:tabular-nums;padding-left:var(--mkt-indent,48px)}
.mkt-chg abbr{text-decoration:none}
.mkt-chg>span:not(.sr-only){min-width:6.8em}
@media (max-width:360px){.mkt-chg{gap:0 10px;padding-left:0}.mkt-chg>span:not(.sr-only){min-width:0}}
.alloc .seg{margin-bottom:10px}
.alloc-sum{margin:6px 0 8px}
.alloc-total{margin:4px 0 14px;font-weight:600}
.alloc .rt .link{min-height:32px;font-size:13px;white-space:nowrap;text-align:right;padding:0;display:inline-block}
.alloc .rt th{white-space:normal}
.alloc .rt .link::after{inset:-8px 0}
.sell-link{color:var(--red)}
/* iPhone-app op het beginscherm: iOS neemt de achtergrondkleur van dit echte element (1 px, bovenaan) over voor de statusbalk.
   Met status-bar-style 'default' tekent iOS geen Liquid Glass-vervaging over de bovenkant van de app (iOS 26/27). */
#sbTint{display:none}
@media (display-mode: standalone){#sbTint{display:block;position:fixed;top:0;left:0;right:0;height:1px;background:var(--bg);z-index:100;pointer-events:none}}
:root.ios-standalone #sbTint{display:block;position:fixed;top:0;left:0;right:0;height:1px;background:var(--bg);z-index:100;pointer-events:none}
/* Tablet in portret (bijv. iPad, 700–999 px): telefoonopbouw met tabbalk, maar de breedte benut */
@media (min-width:700px) and (max-width:999px){
  #app{max-width:900px;padding:0 24px 170px}
  .side-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start;margin-bottom:14px}
  .side-col .card{margin-bottom:0}
  .side-col>.card:first-child:not(:only-child){grid-column:1/-1}
  #pchart svg{height:240px}#pchart .chart-msg{height:240px}
  #chart svg{height:260px}#chart .chart-msg{height:260px}
  .since-g{grid-template-columns:repeat(4,1fr)}
  .rep-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .rep-col{display:grid;gap:16px;align-content:start;grid-template-columns:minmax(0,1fr);min-width:0}
  .tx-sum{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tx-sum .stat:first-child{grid-column:auto}
  .rep-tabs{max-width:560px}
}
.period .seg.mini.pview{margin:0;display:inline-flex}
.seg.mini.pview button{padding:4px 12px;min-height:32px;flex:none}
.pz-view{margin:-6px 0 12px}.pz-view .seg{display:inline-flex}
.pa-legend{list-style:none;margin:2px 0 10px;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:13px;color:var(--muted)}
.pa-legend li{display:flex;align-items:center;gap:6px}
.pa-legend b{color:var(--text);font-weight:600}
.pa-legend b.up{color:var(--green)}.pa-legend b.down{color:var(--red)}
.pa-legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.pa-legend i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)!important}
.pz-info .pa-legend{flex-basis:100%;justify-content:flex-start;margin:4px 0 0}
.pz-info .pa-legend b{font-size:14px}
@media (min-width:1000px){.pa-legend{justify-content:flex-start}}
.pc-tools{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 -2px}
.pc-tools .seg.mini.pview{margin:0;display:inline-flex}
.pc-tools .pz-open{float:none;margin:0;font-size:13px}
/* rechtsboven in het grafiekblok zodra daar naast de waarde ruimte voor is; anders rechts boven de grafiek */
@media (min-width:1000px){.home-grid>.panel{position:relative;container-type:inline-size}}
@container (min-width:600px){.pc-tools{position:absolute;top:22px;right:26px;margin:0}}
.unit-btn{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0 .1em;margin:0 .05em 0 -.1em;border-radius:10px;cursor:pointer;text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:.12em;text-decoration-color:var(--muted)}
.unit-btn:hover{background:var(--card2)}
.unit-menu{position:fixed;inset:auto;margin:0;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);color:var(--text);min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.unit-menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 12px;border:0;border-radius:10px;background:none;color:inherit;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.unit-menu button:hover,.unit-menu button.on{background:var(--card2)}
.unit-menu button.on::after{content:'✓';margin-left:auto;color:var(--accent)}
.unit-sym{display:inline-block;width:1.2em;text-align:center;font-weight:700}
</style>
</head>
<body>
  <div id="sbTint" aria-hidden="true"></div>
  <a class="skip-link" href="#view">Naar hoofdinhoud</a>
  <div class="shell">
    <aside id="side"></aside>
    <div id="app">
      <header class="top" id="topbar"></header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <button type="button" class="fab" id="btnAdd" aria-label="Transactie toevoegen"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabbar only-m" aria-label="Tabbalk">
    <a href="#" data-tab="home"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overzicht</a>
    <a href="#transacties" data-tab="txs"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Transacties</a>
    <a href="#rapporten" data-tab="reps"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Rapporten</a>
  </nav>
  <dialog id="sheet" class="sheet hidden" aria-labelledby="sheetTitle">
    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet-card" id="sheetCard"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <input type="file" id="bvFile" accept=".csv,text/csv" hidden>
  <script src="app.js"></script>
</body>
</html>
